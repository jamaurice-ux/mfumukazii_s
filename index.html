h1 {

p {

}

input[type="password"] {

  font-size: 1rem;
  margin-bottom: 20px;
}

button {
  padding: 15px 30px;
  font-size: 1.2rem;
  border: none;
  border-radius: 8px;
  background-color: #00ffea;
  color: #111;
  cursor: pointer;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 15px #00ffea;
  transition: background-color 0.3s ease;
}

button:hover {
  background-color: #00bbaa;
}

@keyframes pulse {
  0% { box-shadow: 0 0 15px #00ffea; }
  50% { box-shadow: 0 0 30px #00ffea; }

}

<h1>Hey Sibongile ❤️</h1>
<p>I made something special for you. Enter the secret password:</p>

<input type="password" id="passInput" placeholder="Enter password">
<button onclick="checkPassword()">Unlock</button>

<script>
  const correctPassword = "mfumukazii";
  function checkPassword() {
    const entered = document.getElementById("passInput").value;
